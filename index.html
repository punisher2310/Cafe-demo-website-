<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zyro Premium Experience</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b0b0c;
  --card:#141416;
  --accent:#e6b17e;
}

body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:#eee;
  scroll-behavior:smooth;
}

h1,h2{
  font-family:'Playfair Display',serif;
}

/* ===== LOADER ===== */
#loader{
  position:fixed;
  width:100%;
  height:100%;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
  animation:fadeOut 1s ease 2s forwards;
}
#loader video{
  width:100%;
  height:100%;
  object-fit:cover;
}
@keyframes fadeOut{
  to{opacity:0; visibility:hidden;}
}

/* ===== NAV ===== */
.nav{
  position:fixed;
  top:20px;
  left:20px;
  z-index:1000;
  cursor:pointer;
  font-size:28px;
}

/* MENU DROPDOWN */
.menu-box{
  position:absolute;
  top:60px;
  left:0;
  background:var(--card);
  padding:20px;
  border-radius:12px;
  display:none;
  animation:slideDown 0.3s ease;
}
@keyframes slideDown{
  from{opacity:0; transform:translateY(-10px)}
  to{opacity:1; transform:translateY(0)}
}

.menu-box a{
  display:block;
  margin:10px 0;
  text-decoration:none;
  color:white;
}

/* ===== HERO ===== */
.hero{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:linear-gradient(to bottom,#111,#000);
}
.hero h1{
  font-size:48px;
}

/* ===== SECTION ===== */
.section{
  padding:80px 20px;
  text-align:center;
}

/* ===== GALLERY ===== */
.gallery{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
}
.gallery img{
  width:250px;
  margin:10px;
  border-radius:15px;
  transition:0.4s;
}
.gallery img:hover{
  transform:scale(1.2);
  filter:brightness(1.2);
}

/* ===== MENU ===== */
.menu-item{
  background:var(--card);
  padding:15px;
  margin:10px auto;
  max-width:500px;
  border-radius:10px;
  transition:0.3s;
}
.menu-item:hover{
  transform:translateY(-5px);
}

/* ===== REVIEWS ===== */
.reviews{
  overflow:hidden;
  white-space:nowrap;
}
.reviews span{
  display:inline-block;
  padding:0 30px;
  animation:scroll 18s linear infinite;
}
@keyframes scroll{
  from{transform:translateX(100%)}
  to{transform:translateX(-100%)}
}

/* ===== FLOAT ===== */
.float{
  position:fixed;
  bottom:20px;
  right:20px;
}
.float a{
  display:block;
  margin:10px 0;
  padding:14px;
  border-radius:50%;
  background:white;
  text-align:center;
  text-decoration:none;
}

/* ===== REVEAL ===== */
.reveal{
  opacity:0;
  transform:translateY(40px);
  transition:0.6s;
}
.reveal.show{
  opacity:1;
  transform:translateY(0);
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader">
  <video autoplay muted>
    <source src="https://videos.pexels.com/video-files/3129977/3129977-hd_1920_1080_25fps.mp4">
  </video>
</div>

<!-- NAV -->
<div class="nav" onclick="toggleMenu()">☰
  <div class="menu-box" id="menu">
    <a href="#menuSec">Menu</a>
    <a href="#map">Location</a>
    <a href="#">Book Seat</a>
    <a href="#">Timings: 10AM–11PM</a>
  </div>
</div>

<!-- HERO -->
<div class="hero">
  <div>
    <h1>Luxury Coffee Experience</h1>
    <p>Minimal. Elegant. Premium.</p>
  </div>
</div>

<!-- OWNER -->
<div class="section reveal">
  <h2>Message from Owner</h2>
  <p>We craft experiences, not just coffee.</p>
</div>

<!-- GALLERY -->
<div class="section gallery reveal">
  <h2>Our Vibe</h2>
  <img src="https://source.unsplash.com/300x300/?cafe">
  <img src="https://source.unsplash.com/300x300/?coffee">
  <img src="https://source.unsplash.com/300x300/?latte">
</div>

<!-- MENU -->
<div class="section reveal" id="menuSec">
  <h2>Menu</h2>
  <div class="menu-item">Cappuccino — ₹120</div>
  <div class="menu-item">Latte — ₹140</div>
  <div class="menu-item">Cold Coffee — ₹160</div>
</div>

<!-- REVIEWS -->
<div class="section reveal">
  <h2>Reviews</h2>
  <div class="reviews">
    <span>⭐ Amazing experience</span>
    <span>⭐ Premium vibes</span>
    <span>⭐ Loved it</span>
  </div>
</div>

<!-- MAP -->
<div class="section reveal" id="map">
  <iframe width="90%" height="300"
  src="https://maps.google.com/maps?q=kanpur&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>
</div>

<!-- FLOAT -->
<div class="float">
  <a href="https://wa.me/91XXXXXXXXXX">💬</a>
  <a href="tel:XXXXXXXXXX">📞</a>
  <a href="https://maps.google.com">📍</a>
  <a href="https://instagram.com">📷</a>
</div>

<script>
function toggleMenu(){
  let m=document.getElementById('menu');
  m.style.display = (m.style.display==="block")?"none":"block";
}

window.addEventListener('scroll',()=>{
  document.querySelectorAll('.reveal').forEach(el=>{
    if(el.getBoundingClientRect().top < window.innerHeight-80){
      el.classList.add('show')
    }
  })
});
</script>

</body>
</html>
